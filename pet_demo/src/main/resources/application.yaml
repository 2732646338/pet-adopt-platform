server:
  port: 8080
spring:
  application:
    name: cwly
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/pet_adopt?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
      location: D:/uploads/temp/

  jackson:
    default-property-inclusion: non_null

jwt:
  secret: petAdoptSecretKey1234567890abcdefghijklmn
  expiration: 7200000